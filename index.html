<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私人書庫 · 借閱系統</title>
  <meta name="description" content="私人書庫借閱系統，以 Google 帳號登入即可借閱">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-content">
      <div class="logo">
        <span class="logo-icon">📚</span>
        <div>
          <h1>私人書庫</h1>
          <p>借閱系統</p>
        </div>
      </div>
      <div class="user-area" id="userArea">
        <button class="btn-signin" id="signinBtn" onclick="signIn()">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="18">
          以 Google 帳號登入
        </button>
      </div>
    </div>
  </header>

  <!-- User Status Bar (visible when logged in) -->
  <div class="user-status-bar" id="userStatusBar" style="display:none">
    <div class="container">
      <span id="welcomeMsg">歡迎回來！</span>
      <div>
        <span id="borrowCount">目前借閱：0 本</span>
        <button class="btn-outline" onclick="showMyBooks()">我的借閱</button>
        <button class="btn-signout" onclick="signOut()">登出</button>
      </div>
    </div>
  </div>

  <main>
    <div class="container">

      <!-- Filter Bar -->
      <div class="filter-bar">
        <span class="filter-label">篩選分類：</span>
        <div class="filter-buttons">
          <button class="filter-btn active" onclick="filterBooks('all')">全部</button>
          <button class="filter-btn" onclick="filterBooks('心理')">心理</button>
          <button class="filter-btn" onclick="filterBooks('健康')">健康</button>
          <button class="filter-btn" onclick="filterBooks('投資')">投資</button>
          <button class="filter-btn" onclick="filterBooks('心靈')">心靈</button>
          <button class="filter-btn" onclick="filterBooks('宗教')">宗教</button>
          <button class="filter-btn" onclick="filterBooks('勵志')">勵志</button>
          <button class="filter-btn" onclick="filterBooks('英文')">英文</button>
          <button class="filter-btn" onclick="filterBooks('時尚')">時尚</button>
          <button class="filter-btn" onclick="filterBooks('生活')">生活</button>
        </div>
      </div>

      <!-- Books List -->
      <div class="books-list" id="booksList">
        <!-- Rendered by app.js -->
      </div>

    </div>
  </main>

  <!-- Modal: My Borrowed Books -->
  <div class="modal-overlay" id="myBooksModal" style="display:none" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2>我的借閱清單</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="myBooksList"></div>
    </div>
  </div>

  <!-- Modal: Book Detail -->
  <div class="modal-overlay" id="bookDetailModal" style="display:none" onclick="closeDetailModal()">
    <div class="modal modal-large" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modalBookTitle">書名</h2>
        <button class="modal-close" onclick="closeDetailModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBookContent"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <footer>
    <p>© 2026 私人書庫借閱系統 &nbsp;·&nbsp; 以 Google 帳號登入即可借閱 &nbsp;·&nbsp; 共 18 本藏書</p>
  </footer>

  <script src="js/books-data.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
