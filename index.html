<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>陳怡伶的書庫 · 借閱系統</title>
  <meta name="description" content="陳怡伶的私人書庫借閱系統，以 Google 帳號登入即可借閱">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-content">
      <div class="logo">
        <svg class="logo-rabbit" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="24" cy="30" rx="13" ry="11" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
          <ellipse cx="16" cy="14" rx="4" ry="9" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
          <ellipse cx="32" cy="14" rx="4" ry="9" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
          <ellipse cx="17" cy="14" rx="2" ry="6" fill="rgba(255,182,193,0.6)"/>
          <ellipse cx="31" cy="14" rx="2" ry="6" fill="rgba(255,182,193,0.6)"/>
          <circle cx="20" cy="30" r="1.5" fill="rgba(255,255,255,0.9)"/>
          <circle cx="28" cy="30" r="1.5" fill="rgba(255,255,255,0.9)"/>
          <ellipse cx="24" cy="33" rx="2.5" ry="1.5" fill="rgba(255,182,193,0.7)"/>
          <line x1="18" y1="33" x2="12" y2="35" stroke="rgba(255,255,255,0.6)" stroke-width="1" stroke-linecap="round"/>
          <line x1="18" y1="34" x2="12" y2="36" stroke="rgba(255,255,255,0.6)" stroke-width="1" stroke-linecap="round"/>
          <line x1="30" y1="33" x2="36" y2="35" stroke="rgba(255,255,255,0.6)" stroke-width="1" stroke-linecap="round"/>
          <line x1="30" y1="34" x2="36" y2="36" stroke="rgba(255,255,255,0.6)" stroke-width="1" stroke-linecap="round"/>
        </svg>
        <div>
          <h1>陳怡伶的書庫</h1>
          <p>借閱系統</p>
        </div>
      </div>
      <div class="user-area" id="userArea">
        <button class="btn-signin" id="signinBtn" onclick="signIn()">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="18">
          以 Google 帳號登入
        </button>
      </div>
    </div>
  </header>

  <!-- User Status Bar -->
  <div class="user-status-bar" id="userStatusBar" style="display:none">
    <div class="container">
      <span id="welcomeMsg">歡迎回來！</span>
      <div>
        <span id="borrowCount">目前借閱：0 本</span>
        <button class="btn-outline" onclick="showMyBooks()">我的借閱</button>
        <button class="btn-signout" onclick="signOut()">登出</button>
      </div>
    </div>
  </div>

  <main>
    <div class="container">

      <!-- Filter Bar -->
      <div class="filter-bar">
        <span class="filter-label">分類：</span>
        <div class="filter-buttons">
          <button class="filter-btn active" onclick="filterBooks('all')">全部</button>
          <button class="filter-btn" onclick="filterBooks('心理')">心理</button>
          <button class="filter-btn" onclick="filterBooks('健康')">健康</button>
          <button class="filter-btn" onclick="filterBooks('投資')">投資</button>
          <button class="filter-btn" onclick="filterBooks('心靈')">心靈</button>
          <button class="filter-btn" onclick="filterBooks('宗教')">宗教</button>
          <button class="filter-btn" onclick="filterBooks('勵志')">勵志</button>
          <button class="filter-btn" onclick="filterBooks('商業')">商業</button>
          <button class="filter-btn" onclick="filterBooks('英文')">英文</button>
          <button class="filter-btn" onclick="filterBooks('時尚')">時尚</button>
          <button class="filter-btn" onclick="filterBooks('生活')">生活</button>
        </div>
      </div>

      <!-- Books List -->
      <div class="books-list" id="booksList"></div>

      <!-- Pagination -->
      <div class="pagination" id="pagination"></div>

    </div>
  </main>

  <!-- Modal: My Borrowed Books -->
  <div class="modal-overlay" id="myBooksModal" style="display:none" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2>我的借閱清單</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="myBooksList"></div>
    </div>
  </div>

  <!-- Modal: Book Detail -->
  <div class="modal-overlay" id="bookDetailModal" style="display:none" onclick="closeDetailModal()">
    <div class="modal modal-large" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modalBookTitle">書名</h2>
        <button class="modal-close" onclick="closeDetailModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBookContent"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <footer>
    <div class="footer-rabbit">🐇</div>
    <p>陳怡伶的書庫 &nbsp;·&nbsp; 共 46 本藏書 &nbsp;·&nbsp; 以 Google 帳號登入即可借閱</p>
  </footer>

  <script src="js/books-data.js?v=3"></script>
  <script src="js/firebase-config.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
