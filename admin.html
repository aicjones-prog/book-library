<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理後台 · 私人書庫</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <header>
    <div class="header-content">
      <div class="logo">
        <span class="logo-icon">📋</span>
        <div>
          <h1>管理後台</h1>
          <p><a href="index.html" style="color:rgba(255,255,255,0.65);text-decoration:none">← 回書庫</a></p>
        </div>
      </div>
      <div class="user-area" id="userArea">
        <button class="btn-signin" id="signinBtn" onclick="adminSignIn()">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="18">
          以 Google 帳號登入
        </button>
        <div id="userInfo" style="display:none;align-items:center;gap:10px;color:white;font-size:0.85rem">
          <img id="userPhoto" class="avatar" src="" onerror="this.style.display='none'" alt="">
          <span id="userName"></span>
          <button class="btn-signout" onclick="adminSignOut()">登出</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="container" style="padding-top:28px;padding-bottom:48px">

      <!-- Stats Row -->
      <div class="stats-row" id="statsRow">
        <div class="stat-card">
          <div class="stat-num" id="statBorrowed">—</div>
          <div class="stat-label">目前借出</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="statAvail">—</div>
          <div class="stat-label">可借閱</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="statHistory">—</div>
          <div class="stat-label">歷史借閱筆數</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="statBorrowers">—</div>
          <div class="stat-label">不同借閱人數</div>
        </div>
      </div>

      <!-- Currently Borrowed -->
      <section class="admin-section">
        <h2 class="section-title">📚 目前借出中</h2>
        <div id="currentBorrows" class="admin-table-wrap">
          <p class="empty-state">載入中…</p>
        </div>
      </section>

      <!-- Borrow History -->
      <section class="admin-section">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
          <h2 class="section-title" style="margin-bottom:0">🗂 借閱歷史記錄</h2>
          <input class="search-input" id="historySearch" type="text" placeholder="搜尋書名或借閱人…" oninput="filterHistory()">
        </div>
        <div id="historyList" class="admin-table-wrap">
          <p class="empty-state">載入中…</p>
        </div>
      </section>

    </div>
  </main>

  <footer>
    <p>© 2026 私人書庫借閱系統 · 管理後台</p>
  </footer>

  <script src="js/books-data.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
